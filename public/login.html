<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLORA — Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🌸 FLORA</div>
      <h1>Welcome back</h1>
      <p>Увійдіть у свій особистий робочий простір</p>
    </div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="login-username">Логін або Email</label>
        <input type="text" id="login-username" placeholder="Alex" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="login-password">Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <p id="login-error" class="login-error hidden">Невірний логін або пароль</p>

      <button type="submit" id="btn-login" class="btn-primary login-btn">Увійти</button>
    </form>
  </div>

  <script src="/src/login.js" defer></script>
</body>
</html>
